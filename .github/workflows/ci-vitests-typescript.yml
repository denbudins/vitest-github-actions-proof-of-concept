name: Tests TypeScript

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  TypeScript-Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Unit Tests
        run: pnpm run test:unit
