name: TypeScript Code Style Check

permissions:
  contents: read
  pull-requests: write
  checks: write

on:
  push:
    branches: ['master', 'develop']
  pull_request:
    branches: ['master', 'develop']

jobs:
  typescript-code-style-check:
    name: TypeScript Code Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Common setup And Code Style Check
        uses: intellegens-hr/actions/.github/actions/ts-ci@testing-branch
        with:
          version: '10'
          eslint-check-name: 'TypeScript ESLint Code Style Check'
