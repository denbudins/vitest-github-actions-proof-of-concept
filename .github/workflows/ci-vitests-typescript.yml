name: Tests TypeScript

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  TypeScript-Tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Unit Tests
        run: pnpm run test

      - name: Coverage Report
        run: pnpm run coverage

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Vitest Tests
          path: "./**/*.trx"
          reporter: dotnet-trx
          fail-on-error: false
