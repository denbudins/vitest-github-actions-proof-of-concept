name: "TypeScript Code Style Check"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint and generate SARIF
        run: |
          pnpm exec eslint . --format node_modules/@microsoft/eslint-formatter-sarif/sarif.js --output-file results.sarif || true
          pnpm exec eslint . --format=stylish > eslint-summary.txt || true

      - name: Add ESLint summary to workflow
        if: always()
        run: |
          echo '## ESLint Results' >> $GITHUB_STEP_SUMMARY
          cat eslint-summary.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
